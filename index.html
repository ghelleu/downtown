<title>Downtown Studio · deux versions de la maquette</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#fff;font-family:Archivo,Helvetica,Arial,sans-serif;min-height:100vh;display:grid;align-content:center;padding:24px}
.w{max-width:1100px;margin:0 auto;width:100%}
.lab{font-variation-settings:"wdth" 110;font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a}
h1{font-variation-settings:"wdth" 125;font-weight:900;text-transform:uppercase;font-size:clamp(2.4rem,7vw,6rem);line-height:.9;margin:16px 0 48px}
.v{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#333;border:1px solid #333}
.v a{background:#000;color:#fff;text-decoration:none;padding:32px;display:grid;gap:12px}
.v a:hover{background:#E6483A}
.v b{font-variation-settings:"wdth" 125;font-weight:900;font-size:clamp(1.4rem,3vw,2.4rem);text-transform:uppercase;line-height:1}
.v span{color:#c8c8c8}
@media (max-width:700px){.v{grid-template-columns:1fr}}
</style>
</head>
<body><div class="w">
<span class="lab">Downtown Studio · maquette du site</span>
<h1>Deux versions</h1>
<div class="v">
  <a href="/downtown-1/"><span class="lab">Version 1</span><b>Charte Base Design</b><span>Fond blanc, Neue Montreal et Alias Rough, la direction de Base pour Freestudios.</span></a>
  <a href="/downtown-2/"><span class="lab">Version 2</span><b>Famille Cinetic et Progress</b><span>Fond noir, titres en capitales élargies, comme les sites de Cinetic et de Progress.</span></a>
</div>
</div></body>
